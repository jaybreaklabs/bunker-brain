# Stack: the library site. Caddy serves the landing page, the map and its tiles,
# and proxies /library to kiwix-serve. Host paths come from .env (see .env.example).
services:
  web:
    image: caddy:2.11.6-alpine
    container_name: bunker-brain-web
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LIBRARY_DIR:?set LIBRARY_DIR in .env}/web:/srv:ro
      - ${LIBRARY_DIR:?set LIBRARY_DIR in .env}/maps:/srv/tiles:ro
    ports:
      - "8791:80"
    depends_on: [kiwix]
    restart: unless-stopped

  chat:
    # Pinned: Open WebUI upgrades can migrate its database. Back up CONFIG_DIR/open-webui first.
    image: ghcr.io/open-webui/open-webui:v0.13.3
    container_name: bunker-brain-chat
    environment:
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key   # keep logins across re-creates
      WEBUI_NAME: Bunker Brain   # shown as "Bunker Brain (Open WebUI)"
    volumes:
      - ${CONFIG_DIR:?set CONFIG_DIR in .env}/open-webui:/app/backend/data
      # Branding (chat-brand/README.md). Open WebUI copies /app/build/static into its
      # served static folder at start, so these replace its logo, icons and custom.css.
      # Its license allows this for deployments of 50 users or fewer.
      - ./chat-brand/custom.css:/app/build/static/custom.css:ro
      - ./chat-brand/favicon.png:/app/build/static/favicon.png:ro
      - ./chat-brand/favicon.svg:/app/build/static/favicon.svg:ro
      - ./chat-brand/favicon.ico:/app/build/static/favicon.ico:ro
      - ./chat-brand/favicon-96x96.png:/app/build/static/favicon-96x96.png:ro
      - ./chat-brand/apple-touch-icon.png:/app/build/static/apple-touch-icon.png:ro
      - ./chat-brand/logo.png:/app/build/static/logo.png:ro
      - ./chat-brand/splash.png:/app/build/static/splash.png:ro
      - ./chat-brand/splash-dark.png:/app/build/static/splash-dark.png:ro
      - ./chat-brand/web-app-manifest-192x192.png:/app/build/static/web-app-manifest-192x192.png:ro
      - ./chat-brand/web-app-manifest-512x512.png:/app/build/static/web-app-manifest-512x512.png:ro
    ports:
      - "8792:8080"
    restart: unless-stopped
    # The first account to sign up becomes admin: create yours right after the first start,
    # then turn off Admin → Settings → General → Enable New Sign Ups. Keep the port LAN/VPN-only.
    # Model connections (Ollama / OpenAI-compatible) are set in Admin → Connections.
    # The library tool reaches kiwix at http://kiwix:8080/library on this network.

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    container_name: bunker-brain-kiwix
    # The start script expands the glob inside /data. Restart after adding ZIMs.
    command: ["--urlRootLocation=/library", "*.zim"]
    volumes:
      - ${LIBRARY_DIR:?set LIBRARY_DIR in .env}/zim:/data:ro
    ports:
      - "8790:8080"   # direct access, bypassing the web container
    restart: unless-stopped
