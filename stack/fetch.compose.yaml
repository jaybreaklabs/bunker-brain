# Stack: offline-library-fetch — one-shot large downloads via aria2 (torrent + web seeds).
# Edit URL, start the stack, it exits when done. Files land in $LIBRARY_DIR/incoming
# and are moved into zim/ only after a SHA-256 check against the Kiwix .meta4.
services:
  aria2:
    image: alpine:3.20
    container_name: offline-library-fetch
    restart: "no"
    volumes:
      - ${LIBRARY_DIR:?set LIBRARY_DIR in .env}/incoming:/incoming
    environment:
      URL: https://lb.download.kiwix.org/zim/zimit/survivorlibrary.com_en_all_2026-09.zim.torrent
    command:
      - sh
      - -c
      - >-
        apk add --no-cache aria2 &&
        aria2c --dir=/incoming --follow-torrent=mem --seed-time=0
        --max-connection-per-server=4 --split=16 --bt-max-peers=60
        --file-allocation=none --summary-interval=60 --console-log-level=notice
        "$$URL"
