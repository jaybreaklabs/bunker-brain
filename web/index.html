<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Offline Library</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --text: #1b1b1b; --muted: #5a5a5a;
    --line: #dcd9d2; --accent: #0b5cad; --accent-text: #ffffff; --warn-bg: #fff4d6; --warn-text: #4a3800;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --card: #1f1f1f; --text: #ececec; --muted: #a9a9a9;
      --line: #343434; --accent: #6cb2ff; --accent-text: #0b1a2a; --warn-bg: #2e2610; --warn-text: #f3dc9a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 4.5rem; /* room for the fixed disclaimer */
  }
  main { max-width: 1100px; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.6rem; margin: .5rem 0 1rem; }
  h2 { font-size: 1.2rem; margin: 2rem 0 .75rem; padding-bottom: .3rem; border-bottom: 2px solid var(--line); }
  a { color: var(--accent); }
  form.search { display: flex; gap: .5rem; margin-bottom: 1rem; }
  form.search input {
    flex: 1; min-width: 0; min-height: 48px; padding: .6rem .8rem; font: inherit;
    color: var(--text); background: var(--card); border: 2px solid var(--line); border-radius: 10px;
  }
  form.search input:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
  form.search button {
    min-height: 48px; padding: 0 1.2rem; font: inherit; font-weight: 600; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .75rem; }
  .tile {
    display: flex; gap: .75rem; align-items: flex-start; min-height: 64px; padding: .8rem .9rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); text-decoration: none;
  }
  .tile:hover, .tile:focus-visible { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent); }
  .tile img { width: 40px; height: 40px; flex: none; border-radius: 6px; }
  .tile strong { display: block; font-size: 1.02rem; }
  .tile span { display: block; color: var(--muted); font-size: .88rem; }
  .tile.big { min-height: 84px; align-items: center; }
  .tile.big strong { font-size: 1.2rem; }
  .icon { width: 40px; height: 40px; flex: none; display: grid; place-items: center; font-size: 1.5rem; }
  .empty { color: var(--muted); margin: 0; }
  ul.links { list-style: none; padding: 0; margin: 0; display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  ul.links li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .6rem .9rem; }
  ul.links a.main { display: block; min-height: 32px; font-weight: 600; text-decoration: none; padding: .2rem 0; }
  ul.links a.fb { font-size: .85rem; display: inline-block; min-height: 28px; padding-top: .2rem; }
  .status { color: var(--muted); }
  .dev-banner {
    background: #b00020; color: #fff; padding: .6rem 1rem; border-radius: 8px; margin: 1rem 0; font-weight: 600;
  }
  .disclaimer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; margin: 0;
    padding: .55rem 1rem calc(.55rem + env(safe-area-inset-bottom));
    background: var(--warn-bg); color: var(--warn-text); border-top: 1px solid var(--line);
    font-size: .82rem; text-align: center;
  }
</style>
</head>
<body>
<main>
  <h1>Offline Library</h1>

  <form class="search" action="/library/search" method="get" role="search">
    <input type="search" name="pattern" placeholder="Search all books" aria-label="Search all books" required>
    <button type="submit">Search</button>
  </form>

  <div class="grid">
    <a class="tile big" href="/map/"><span class="icon" aria-hidden="true">🗺️</span><div><strong>Map</strong><span>Offline world map with your location</span></div></a>
    <a class="tile big" id="chat-tile" href="#" hidden><span class="icon" aria-hidden="true">💬</span><div><strong>Ask</strong><span>Chat that searches the library</span></div></a>
    <a class="tile big" href="/library/"><span class="icon" aria-hidden="true">📚</span><div><strong>All books</strong><span>Full Kiwix catalog</span></div></a>
  </div>

  <div id="sections"><p class="status">Loading library…</p></div>

  <h2>Around the house</h2>
  <ul class="links" id="links"></ul>
</main>

<p class="disclaimer">Medical and survival content here is reference material, not professional care. In an emergency, call for help first.</p>

<script>
"use strict";
const CATALOG_URL = "/library/catalog/v2/entries?count=-1";
const SECTIONS = ["Medical", "Water & Food", "Repair & Build", "Power & Energy", "Preparedness", "Reference", "Learning", "Other"];
// DEV ONLY: when the real catalog is unreachable on a local dev host, use a saved
// copy of a live catalog response. Never used in production; don't deploy web/dev/.
const DEV_CATALOG_URL = "/dev/catalog.xml";
const IS_DEV_HOST = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);

const getJSON = (url) => fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null);

// Kiwix links in the catalog are absolute paths; add the /library prefix if the server didn't.
const lib = (href) => (href.startsWith("/library/") ? href : "/library" + href);

async function loadCatalog() {
  let dev = false;
  let res = await fetch(CATALOG_URL).catch(() => null);
  if ((!res || !res.ok) && IS_DEV_HOST) {
    res = await fetch(DEV_CATALOG_URL).catch(() => null);
    dev = true;
  }
  if (!res || !res.ok) throw new Error("catalog unavailable");
  const xml = new DOMParser().parseFromString(await res.text(), "application/xml");
  const text = (el, tag) => el.getElementsByTagName(tag)[0]?.textContent.trim() || "";
  const books = [...xml.getElementsByTagName("entry")].map((e) => ({
    name: text(e, "name"),
    flavour: text(e, "flavour"),
    title: text(e, "title"),
    summary: text(e, "summary"),
    href: e.querySelector('link[type="text/html"]')?.getAttribute("href") || "",
    icon: e.querySelector('link[rel="http://opds-spec.org/image/thumbnail"]')?.getAttribute("href") || "",
  }));
  return { books: books.filter((b) => b.href), dev };
}

function sectionFor(book, zims, prefixes) {
  if (zims) {
    const hits = zims.filter((z) => z.name === book.name && (!z.flavour || !book.flavour || z.flavour === book.flavour));
    const z = hits.find((h) => h.flavour === book.flavour) || hits[0];
    if (z) return { section: z.section, title: z.title || book.title, priority: z.priority ?? 99 };
  }
  let best = "";
  for (const p of Object.keys(prefixes || {})) if (book.name.startsWith(p) && p.length > best.length) best = p;
  return { section: best ? prefixes[best] : "Other", title: book.title, priority: 99 };
}

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  n.append(...kids);
  return n;
}

function bookTile(b) {
  const a = el("a", { class: "tile", href: lib(b.href) });
  if (b.icon) {
    const img = el("img", { src: lib(b.icon), alt: "", loading: "lazy", width: 40, height: 40 });
    img.onerror = () => img.remove();
    a.append(img);
  }
  a.append(el("div", {}, el("strong", {}, b.title), el("span", {}, b.summary)));
  return a;
}

async function renderBooks() {
  const box = document.getElementById("sections");
  const [zims, collections] = await Promise.all([getJSON("/zims.json"), getJSON("/collections.json")]);
  let catalog;
  try {
    catalog = await loadCatalog();
  } catch {
    box.replaceChildren(el("p", { class: "status" }, "The library isn't responding right now. Try ", el("a", { href: "/library/" }, "the Kiwix catalog"), " directly."));
    return;
  }
  const groups = Object.fromEntries(SECTIONS.map((s) => [s, []]));
  for (const b of catalog.books) {
    const m = sectionFor(b, Array.isArray(zims) ? zims : null, collections?.prefixes);
    (groups[m.section] || groups.Other).push({ ...b, title: m.title, priority: m.priority });
  }
  const out = [];
  if (catalog.dev) out.push(el("div", { class: "dev-banner" }, "DEV MODE: kiwix not reachable at /library/, showing the saved catalog in web/dev/catalog.xml. Book links will not work."));
  for (const s of SECTIONS) {
    const books = groups[s].sort((a, b) => a.priority - b.priority || a.title.localeCompare(b.title));
    if (s === "Other" && !books.length) continue;
    out.push(el("h2", {}, s));
    out.push(books.length ? el("div", { class: "grid" }, ...books.map(bookTile)) : el("p", { class: "empty" }, "No books in this section yet."));
  }
  box.replaceChildren(...out);
}

async function renderLinks() {
  const all = (await getJSON("/links.json")) || [];
  const chat = all.find((l) => l.id === "chat");
  if (chat) Object.assign(document.getElementById("chat-tile"), { href: chat.url, hidden: false });
  const links = all.filter((l) => l !== chat);
  document.getElementById("links").replaceChildren(...links.map((l) => {
    const li = el("li", {}, el("a", { class: "main", href: l.url }, l.label));
    if (l.fallback_url) li.append(el("a", { class: "fb", href: l.fallback_url }, "No DNS? Use " + l.fallback_url.replace(/^https?:\/\//, "")));
    return li;
  }));
}

renderBooks();
renderLinks();
</script>
</body>
</html>
