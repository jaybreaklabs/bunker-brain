<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#293420">
<title>Field library · Bunker Brain</title>
<link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" sizes="any" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/app-icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<script defer src="/brand/install-icons.js"></script>
<link rel="stylesheet" href="/brand/tokens.css">

<style>
  /* Page layout only; look and feel lives in /brand/. */
  .home-layout { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(260px, .92fr); gap: clamp(28px, 4.5vw, 68px); }
  .home-side .bb-card { margin-bottom: 20px; }
  .home-tools > .bb-row:first-child { border-top: 2px solid var(--bb-rule); }
  .home-house { margin-top: 36px; }
  .home-pocket, .home-phone-only { display: none; }
  @media (max-width: 750px) {
    .home-layout { display: block; }
    .home-side { display: none; }
    .home-pocket { display: grid; grid-template-columns: 1fr 1.3fr; gap: 7px; margin: -12px 0 28px; }
    .home-pocket img { grid-row: span 2; width: 100%; height: 100%; min-height: 96px; object-fit: cover; }
    .home-pocket--solo .bb-button { grid-row: span 2; }
    .home-lead { display: none; }
    .home-phone-only { display: flex; margin: -12px 0 28px; }
  }
</style>
</head>
<body class="bb-paper">
<header class="bb-header">
  <div class="bb-header__inner">
    <a href="#" aria-label="Bunker Brain home"><img class="bb-header__logo" src="/brand/lockup-cream.png" alt="Bunker Brain" width="220" height="32"></a>
    <nav class="bb-nav" aria-label="Main">
      <a href="#" data-view="home">Field library</a>
      <a href="/map/">Offline map</a>
      <a href="#" id="nav-ask" hidden>Ask</a>
      <a href="#books" data-view="books">All books</a>
    </nav>
  </div>
</header>

<main class="bb-main" id="page" tabindex="-1"><p class="bb-status">Loading library…</p></main>

<footer class="bb-footer"><p>Medical and survival content here is reference material, not professional care. In an emergency, call for help first.</p></footer>

<script type="module" src="/home.js"></script>
</body>
</html>
